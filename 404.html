<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada · Baverone</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07080d">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{--bg:#07080d;--ink:#eef0f6;--muted:#8c93a8;--gold:#f5c451;--violet:#a77bff;--green:#38d39f}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;-webkit-font-smoothing:antialiased}
.code{font-weight:700;font-size:clamp(4rem,18vw,8rem);line-height:1;letter-spacing:-.03em;background:linear-gradient(100deg,var(--gold),var(--violet) 45%,var(--green));-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:1.5rem;margin-top:12px}
p{color:var(--muted);max-width:420px;margin:12px auto 0}
a.btn{display:inline-block;margin-top:28px;padding:12px 22px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.04);color:var(--ink);text-decoration:none;font-weight:600}
a.btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@media (hover:hover){a.btn:hover{border-color:var(--gold)}}
</style>
</head>
<body>
<main>
  <div class="code">404</div>
  <h1>Esta página não existe</h1>
  <p>O endereço pode estar errado ou a página mudou de sítio.</p>
  <a class="btn" href="/">Voltar aos cartões</a>
</main>
</body>
</html>
